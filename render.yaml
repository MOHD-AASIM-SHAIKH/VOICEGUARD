services:
  - type: web
    name: voiceguard-sih-demo
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
